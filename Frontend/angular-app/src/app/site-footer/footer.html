<footer class="menu-footer">
  <div class="footer-inner">

    <div class="footer-actions-area" *ngIf="true">
      <ng-content select="[footer-actions]"></ng-content>
    </div>

    <div class="impressum-desktop">
      <span>{{ companyName }}</span>
      <span>{{ inhaber }}</span>
      <span>{{ address }}</span>
      <span>{{ uid }}</span>
    </div>

    <div class="impressum-mobile">
      <button class="impressum-btn" type="button" (click)="openImpressum()">
        Impressum
      </button>
    </div>

    <div
      class="impressum-popup-overlay"
      *ngIf="showImpressumPopup"
      (click)="closeImpressum()"
    >
      <div class="impressum-popup" (click)="$event.stopPropagation()">
        <h2>Impressum</h2>
        <div class="impressum-details">
          <p><strong>{{ companyName }}</strong></p>
          <p>{{ inhaber }}</p>
          <p>{{ address }}</p>
          <p>{{ uid }}</p>
         
        </div>

        <button class="close-btn" type="button" (click)="closeImpressum()">
          Schließen
        </button>
      </div>
    </div>

  </div>
</footer>
