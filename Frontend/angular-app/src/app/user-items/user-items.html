<div class="user-card" [class.blocked]="user.blocked" (click)="navigateToUser($event)">
  <div class="user-summary">
    <div class="user-info">
      <h2>{{ user.name }}</h2>
      <p class="meta">
        <span>{{ user.email }}</span> ·
        <span>Klasse: {{ user.class }}</span> ·
        <span>Bestellungen: {{ user.orderCount }}</span>
      </p>
    </div>

    <div class="user-controls-row">
      <!-- ✅ Guthaben nur anzeigen -->
      <div class="balance">
        <span class="balance-amount">{{ user.balance | currency:'EUR' }}</span>
      </div>

      <div class="actions-inline">
        <button class="icon-btn delete"
                (click)="emitDelete($event)"
                title="Benutzer löschen">🗑</button>

        <button class="icon-btn block"
                (click)="emitBlock($event)"
                title="Benutzer sperren">⊘</button>


        <button class="icon-btn details"
                (click)="toggleDetails($event)"
                title="Details anzeigen">
          {{ showDetails ? '▴' : '▾' }}
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="showDetails" class="user-details" (click)="$event.stopPropagation()">
    <div class="detail-row">
      <label>Guthaben:</label>
      <span>{{ user.balance | currency:'EUR' }}</span>
    </div>
    <div class="detail-row">
      <label>Klasse:</label>
      <span>{{ user.class }}</span>
    </div>
    <div class="detail-row">
      <label>Bestellungen:</label>
      <span>{{ user.orderCount }}</span>
    </div>
  </div>
</div>
