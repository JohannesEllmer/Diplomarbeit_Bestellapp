<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Passwort vergessen</h1>
      <p>Wir senden dir einen Link zum Zurücksetzen deines Passworts.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group" [class.invalid]="email?.invalid && (email?.touched || email?.dirty)">
        <label for="email">E-Mail-Adresse</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="z.B. vorname.nachname@htl-saalfelden.at"
          autocomplete="email"
        />

        <div class="error" *ngIf="email?.errors && (email?.touched || email?.dirty)">
          <span *ngIf="email?.errors?.['required']">E-Mail ist erforderlich.</span>
          <span *ngIf="email?.errors?.['email']">Bitte eine gültige E-Mail eingeben.</span>
        </div>
      </div>

      <button class="primary-btn" type="submit" [disabled]="loading || form.invalid">
        <span class="btn-row">
          <span class="spinner" *ngIf="loading"></span>
          {{ loading ? 'Sende...' : 'Link anfordern' }}
        </span>
      </button>

      <!-- neutrales Erfolgsergebnis (keine Account-Leaks) -->
      <div class="status-card is-success" *ngIf="done">
        <div class="status-icon">✓</div>
        <div class="status-text">
          <div class="status-title">Wenn ein Account existiert…</div>
          <div class="status-msg">
            …haben wir dir eine E-Mail mit einem Link geschickt. Bitte prüfe auch den Spam-Ordner.
          </div>
        </div>
      </div>

      <!-- optionaler Technik-Fehler (standardmäßig leer) -->
      <div class="status-card is-error" *ngIf="error">
        <div class="status-icon">✕</div>
        <div class="status-text">
          <div class="status-title">Fehler</div>
          <div class="status-msg">{{ error }}</div>
        </div>
      </div>

      <div class="auth-footer">
        <a routerLink="/login">Zurück zum Login</a>
      </div>
    </form>
  </div>
</div>
