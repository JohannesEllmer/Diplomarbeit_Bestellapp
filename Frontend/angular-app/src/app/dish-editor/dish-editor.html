<div class="dish-editor-container">
  <div class="dish-editor-body">
    <div class="dish-inputs-container">
      <div class="inputs-scrollable">
        <div class="input-row">
          <div class="input-group">
            <label for="dish-name">Name</label>
            <input
              id="dish-name"
              type="text"
              placeholder="Gericht Name"
              [(ngModel)]="dish.name"
            />
          </div>

          <div class="input-group">
            <label for="dish-price">Preis</label>
            <input
              id="dish-price"
              type="number"
              placeholder="Preis in €"
              [(ngModel)]="dish.price"
            />
          </div>
        </div>

        <div class="input-group">
          <label for="dish-description">Beschreibung</label>
          <textarea
            id="dish-description"
            placeholder="Gericht Beschreibung"
            [(ngModel)]="dish.description"
          ></textarea>
        </div>

        <div class="input-row">
          <div class="input-group">
            <label for="dish-category">Kategorie</label>

            <select
              id="dish-category"
              [(ngModel)]="dish.category"
              (ngModelChange)="onCategoryChange()"
            >
              <option value="" disabled>Bitte wählen…</option>
              @for (cat of categoryOptions; track cat) {
                <option [value]="cat">{{ cat }}</option>
              }
            </select>

          </div>

          <div class="input-group allergens-container">
            <label for="dish-allergens">Allergene</label>

            <div style="display: flex; gap: 0.5rem; width: 150%;">
              <input
                id="dish-allergens"
                type="text"
                placeholder="z.B. Gluten"
                [(ngModel)]="allergenTemp"
                style="flex: 1;"
              />
              <button
                class="add-allergen-button"
                type="button"
                (click)="addAllergen()"
                style="flex-shrink: 0;"
              >
                +
              </button>
            </div>

            <div class="allergens-output-container">
              @for (allergen of (dish.allergens ?? []); track allergen) {
                <span
                  style="background: #e0e7ef;border-radius: 12px; padding: 0.2rem 0.8rem; display: flex; align-items: center;"
                >
                  {{ allergen }}
                  <button
                    class="remove-allergen-button"
                    type="button"
                    (click)="removeAllergen(allergen)"
                  >
                    &times;
                  </button>
                </span>
              }
            </div>
          </div>

          <div class="input-group vegetarian-group">
            <label class="vegetarian-label">
              <input
                type="checkbox"
                id="dish-vegetarian"
                [(ngModel)]="dish.vegetarian"
              />
              Vegetarisch
            </label>
          </div>
        </div>

        <div class="input-row" *ngIf="isMenuCategory">
          <div class="input-group">
            <label for="drink">Getränk</label>
            <input
              id="drink"
              type="text"
              placeholder="Getränk"
              [(ngModel)]="dish.drink"
            />
          </div>

          <div class="input-group">
            <label for="dessert">Nachspeise</label>
            <input
              id="dessert"
              type="text"
              placeholder="Nachspeise"
              [(ngModel)]="dish.dessert"
            />
          </div>
        </div>
      </div>

      <button class="save-dish-button" (click)="onSave()" [disabled]="!canSave">
        Speichern
      </button>

      <button class="cancel-dish-button" type="button" (click)="onCancel()" [disabled]="saving">
        Abbrechen
      </button>

      @if (saveError) {
        <div class="save-error">
          {{ saveError }}
        </div>
      }
    </div>

    <div class="dish-preview-container">
      <app-menu-item [item]="dish"></app-menu-item>
    </div>
  </div>
</div>
