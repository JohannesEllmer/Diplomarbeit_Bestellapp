<article class="menu-card"
         [class.unavailable]="!canOrder">

  <!-- ✅ Rechts oben: Menü oder Gericht -->
  <span class="type-label">
    {{ typeLabel }}
  </span>

  <!-- ✅ Nicht verfügbar / Im Menü enthalten – nicht mehr kollidierend -->
  <span class="unavailable-label" *ngIf="!canOrder">
    {{ isExtraItem ? 'Im Menü enthalten' : 'Nicht verfügbar' }}
  </span>

  <div class="card-content">
    <div class="card-header">
      <h3>{{ item.name }}</h3>

      <div class="tags">
        <span class="category-tag">{{ item.category }}</span>
        <span class="vegetarian-tag" *ngIf="item.vegetarian">Vegetarisch</span>
      </div>
    </div>

    <p class="menu-desc">{{ item.description }}</p>

    <!-- ✅ Extras nur wenn Menü -->
    <ul class="menu-extras" *ngIf="isMenuSet">
      <li *ngIf="menuDrink">Getränk: {{ menuDrink }}</li>
      <li *ngIf="menuDessert">Dessert: {{ menuDessert }}</li>
    </ul>

    <div class="allergens" *ngIf="item.allergens?.length">
      <strong>Allergene:</strong> {{ item.allergens.join(', ') }}
    </div>

    <div class="note-input" *ngIf="!isExtraItem">
      <textarea [(ngModel)]="note" placeholder="Bemerkung (optional)"></textarea>
    </div>

    <div class="card-footer">
      <span class="price">
        {{ (item.price ?? 0) | currency: 'EUR' }}
      </span>

      <button class="add-btn"
              (click)="addToOrder()"
              [disabled]="!canOrder">
        Hinzufügen
      </button>
    </div>
  </div>
</article>
